[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-prototype"
version = "0.1.0"
description = "Spectral-spatial anomaly detection in hyperspectral and thermal (IR) remote sensing data"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Atharv Donadkar" }]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "torch>=2.0",
    "opencv-python>=4.8",
    "Pillow>=10.0",
    "spectral>=0.23",
    "h5py>=3.9",
    "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=7.4", "pytest-cov>=4.1", "astropy>=5.3"]
dashboard = ["streamlit>=1.30"]
flir = ["flirpy>=0.4"]

[project.scripts]
run-hyperspectral = "pipeline.cli.run_hyperspectral:main"
run-thermal = "pipeline.cli.run_thermal:main"
run-fusion = "pipeline.cli.run_fusion:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: tests that train a model or process a full scene",
    "needs_data: tests that require scripts/download_data.py to have run",
]

[tool.coverage.run]
source = ["src/pipeline"]
