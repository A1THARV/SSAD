# HAD100 under the benchmark's own band50 protocol -- the matched comparison.
#
# HAD100's published table has three columns (band50 / band100 / band200) and its
# shipped code never says what they mean. Recovered by measurement: they are the
# FIRST N of the 276 bands main.py writes. Plain RX (Eq. 2) on the first 50
# reproduces the benchmark's own GRX baseline to four decimal places --
#
#     ours 0.9799 / 0.9714 / 0.9653   vs   published 0.9799 / 0.9714 / 0.9649
#
# -- where uniform subsampling (0.9742 / 0.9710) and strided selection
# (0.9727 / 0.9701) both miss. See scripts/had100_baselines.py.
#
# That matters twice over. It verifies Eq. 2 against a published reference
# implementation on a public benchmark, and it makes band50 the setting where
# every baseline in the table is at its strongest -- so it is the hardest bar to
# clear, and the honest one to report against.
#
# What the first 50 bands actually are: original AVIRIS-NG bands 15-65, i.e.
# 455-700 nm. The visible spectrum. Fifty-band windows elsewhere in the range
# score far worse on identical machinery --
#
#      455- 700 nm  0.9799      1000-1310 nm  0.8423
#      705- 995 nm  0.8905      1515-2030 nm  0.9067
#                               2035-2280 nm  0.9162
#
# -- so the benchmark's band50 advantage is a wavelength effect, not a
# dimensionality one. Recorded in RESULTS.md; measured on the labelled test
# images because HAD100 ships no labelled validation split, and reported with
# that caveat attached rather than presented as a held-out selection.

dataset:
  name: had100_band50
  kind: hyperspectral
  path: data/hyperspectral/had100/HAD100/HAD100Dataset/test/aviris_ng
  file_format: npy
  sensor: aviris_ng
  ground_truth_path: data/hyperspectral/had100/HAD100/HAD100Dataset/ground_truth/aviris_ng
  label_convention: binary_mask
  notes: >
    100 test images from 94 source scenes, restricted to the benchmark's band50
    protocol (the first 50 of the 276 bands main.py writes, = 455-700 nm).

preprocess:
  good_bands_preset: had100_band50
  water_absorption_bands_nm: []
  snr_threshold: null
  clip_percentile: 99.9
  pca_n_components: 15
  pca_variance: 0.99
  cache_reduced: true
  cache_dir: data/cache

rx:
  ridge: 1.0e-6
  # Measured, not assumed: the corpus basis beat the per-scene basis by
  # +0.0057 mAUC at K=15 on the full 276-band setting (0.9806 vs 0.9749), which
  # is also what Fig. 1 draws -- one PCA block feeding both branches. The
  # figure was right and the earlier "keep them separate" decision was not.
  pca_basis: corpus

autoencoder:
  enabled: true
  training_corpus: data/hyperspectral/had100/HAD100/HAD100Dataset/train/aviris_ng
  train_on_test_scene: false
  patch_size: 7
  latent_dim: 8
  encoder_channels: [32, 64, 128]
  kernel_spatial: 3
  kernel_spectral_depths: [7, 5, 3]
  lam: 0.1
  epochs: 20
  batch_size: 256
  max_patches: 40000
  whiten_input: false
  sam_domain: spectral
  amp: true
  vram_budget_gb: 3.3
  gradient_checkpointing: false
  device: auto

score_fusion:
  mode: weighted
  alpha: 0.5
  threshold_method: otsu
  threshold_percentile: 99.0
  threshold_gamma: 3.0
  validation_split: 0.2
  validation_seed: 12345

sam:
  top_k: 3
  low_confidence_angle_rad: 0.25
  library_path: data/speclib/ecostress/curated_library.npz

seed: 0
deterministic: true
output_root: results
